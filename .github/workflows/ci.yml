---
name: Verify
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: test -s bun.lock && bun install --frozen-lockfile --ignore-scripts
      - run: bun run generate:check
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun pm pack --dry-run --ignore-scripts

  stage-contract:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_SPELEODB_INSTANCE: ${{ secrets.TEST_SPELEODB_INSTANCE }}
      TEST_SPELEODB_OAUTH: ${{ secrets.TEST_SPELEODB_OAUTH }}
      TEST_SPELEODB_PROJECT_ID: ${{ secrets.TEST_SPELEODB_PROJECT_ID }}
      TEST_SPELEODB_EMPTY_PROJECT_ID: ${{ secrets.TEST_SPELEODB_EMPTY_PROJECT_ID }}
      TEST_SPELEODB_GIS_LAYER_ID: ${{ secrets.TEST_SPELEODB_GIS_LAYER_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: test -s bun.lock && bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:stage

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, stage-contract]
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check tag matches package version
        run: |
          package_version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$package_version"
      - run: test -s bun.lock && bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: npm publish --access public
